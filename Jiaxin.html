<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欣之所向</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;overflow:hidden;height:100vh;user-select: none;}
canvas{display:block;width:100vw;height:100vh;}
audio{display:none;}
#hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  font-size: 18px;
  color: #666;
  letter-spacing: 2px;
  pointer-events: none;
  transition: opacity 1s;
}
</style>
</head>
<body>
<div id="hint">点击页面 唤醒嘉欣</div>
<canvas id="visualizer"></canvas>
<audio id="bgMusic" loop crossorigin="anonymous">
  <source src="shulik.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('bgMusic');
const hint = document.getElementById('hint');

let mouse = { x: -1000, y: -1000 };

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

const jpChars = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';

class TextParticle {
  constructor(x, y, char, speedFactor) {
    this.x = x;
    this.y = y;
    this.char = char;
    // 核心字稍微大一点，普通字保持原样
    const isKey = keyChars.includes(char);
    this.fontSize = isKey ? Math.floor(Math.random() * 10) + 30 : Math.floor(Math.random() * 14) + 16;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = -(Math.random() * 3 + 2) * speedFactor;
    this.alpha = 1;
    this.decay = Math.random() * 0.008 + 0.004; // 稍微放慢自然消散速度
    this.isExploded = false;
    // 核心字颜色更鲜明一些
    this.color = isKey ? `hsla(340, 80%, 65%, ` : `hsla(${Math.random() * 360}, 60%, 65%, `; 
  }

  update(shouldExplode) {
    // 增加鼠标交互：划过字符时触发炸开
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (!this.isExploded && (shouldExplode || distance < 60)) {
      this.isExploded = true;
      // 如果是被鼠标划过，产生带有方向感的爆破
      if (distance < 60 && !shouldExplode) {
        this.vx = (dx / distance) * (Math.random() * 8 + 4);
        this.vy = (dy / distance) * (Math.random() * 8 + 4);
      } else {
        this.vx = (Math.random() - 0.5) * (Math.random() * 12 + 4);
        this.vy = (Math.random() - 0.5) * (Math.random() * 12 + 4);
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    if (this.isExploded) {
      this.vy += 0.25; // 稍微增加重力感
      this.alpha -= 0.025;
    } else {
      this.alpha -= this.decay;
    }
  }

  draw() {
    if (this.alpha <= 0) return;
    ctx.fillStyle = this.color + this.alpha + ')';
    ctx.font = `bold ${this.fontSize}px sans-serif`;
    ctx.fillText(this.char, this.x, this.y);
  }
}

let particles = [];
let audioCtx, analyser, dataArray;
let isAudioStarted = false;

document.addEventListener('click', () => {
  if (isAudioStarted) return;

  audio.play().catch(e => console.log('温馨提示：本地直接双击打开可能因浏览器安全限制无法播放音频，建议使用本地服务器环境（如 Live Server）运行。错误信息：', e));
  hint.style.opacity = 0;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize = 64; 
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  isAudioStarted = true;
}, { once: true });

// 监听鼠标/触摸移动
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener('touchmove', (e) => {
  if(e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }
});
window.addEventListener('mouseleave', () => { mouse = { x: -1000, y: -1000 }; });

// 用于平滑动态阈值的变量
let historyBass = 150;

function draw() {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let energy = 0;

  if (isAudioStarted && analyser) {
    analyser.getByteFrequencyData(dataArray);
    let bassSum = 0;
    for(let i = 0; i < 4; i++) {
      bassSum += dataArray[i];
    }
    energy = bassSum / 4; 
  }

  // 1. 字符生成
  const spawnChance = isAudioStarted ? (energy / 255) * 0.7 + 0.15 : 0.1;
  if (Math.random() < spawnChance) {
    const x = Math.random() * canvas.width;
    const y = canvas.height + 20;
    
    // 10% 概率生成核心情感文字
    let char;
    if (Math.random() < 0.1) {
      char = keyChars[Math.floor(Math.random() * keyChars.length)];
    } else {
      char = jpChars[Math.floor(Math.random() * jpChars.length)];
    }

    const speedFactor = isAudioStarted ? (energy / 255) * 1.6 + 0.8 : 1;
    particles.push(new TextParticle(x, y, char, speedFactor));
  }

  // 2. 动态音频爆破阈值算法（自动适应不同歌曲的音量）
  historyBass = historyBass * 0.98 + energy * 0.02; // 滚动计算近期平均低音
  const dynamicThreshold = Math.max(historyBass * 1.15, 140); // 阈值保持在平均值的1.15倍
  const shouldExplode = energy > dynamicThreshold && Math.random() > 0.4;

  // 3. 更新与绘制
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const canExplodeHere = p.y < canvas.height * 0.85;

    p.update(shouldExplode && canExplodeHere);
    p.draw();

    if (p.alpha <= 0 || p.x < -50 || p.x > canvas.width + 50 || p.y > canvas.height + 50) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(draw);
}

draw();

window.addEventListener('resize', () => {
  resize();
  particles = [];
});
</script>
</body>
</html>
